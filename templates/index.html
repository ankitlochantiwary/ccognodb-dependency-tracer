<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CognoDB SkillGraph</title><link rel='stylesheet' href='/static/styles.css'></head><body><main><header><div><span class='eyebrow'>GRAPH-NATIVE TALENT EXPLORER</span><h1>SkillGraph</h1><p>Explore people, skills, projects and roles as connected data.</p></div><div class='badge'>CognoDB</div></header><section class='stats'>{% for k,v in summary.items() %}<div class='stat'><strong>{{v}}</strong><span>{{k}}</span></div>{% endfor %}</section><section class='panel'><div class='section-head'><h2>People</h2><input id='search' placeholder='Search people…'></div><div id='people' class='people'></div></section><section class='panel'><div class='section-head'><h2>Explore a skill</h2><select id='skill'>{% for s in skills %}<option value='{{s.name}}'>{{s.name}}</option>{% endfor %}</select></div><div id='recommendations'></div></section><section id='profile' class='panel hidden'></section></main><script src='/static/app.js'></script></body></html>
